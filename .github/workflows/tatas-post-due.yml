name: Tatas post due (Tech 4 Tatas)

# Posts approved carousels whose slot time has arrived, directly to Instagram
# via the Graph API. Idempotent — runs that find nothing due exit in seconds.
#
# Slots are MON–FRI 12:00 MT. The writer stores scheduledFor in UTC with a
# fixed MT(-6) offset, so the cron fires 10 minutes after each slot exactly.
# Anything missed posts on the next run (72h staleness cutoff — never late-posts).

on:
  schedule:
    - cron: '10 18 * * 1-5'   # Mon–Fri 18:10 UTC = 12:10 MT
  workflow_dispatch:           # manual catch-up / testing

concurrency:
  group: tatas-git-writes
  cancel-in-progress: false

jobs:
  post-due:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # commit posted status + IG media IDs back to state.json
      issues: write     # failure alert opens an issue

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tatas/package-lock.json

      - name: Install dependencies
        run: cd tatas && npm install --omit=optional --no-audit --no-fund

      - name: Post due carousels to Instagram
        run: cd tatas && node scripts/post-due.js
        env:
          TATAS_IG_TOKEN:        ${{ secrets.TATAS_IG_TOKEN }}
          TATAS_IG_USER_ID:      ${{ secrets.TATAS_IG_USER_ID }}
          TATAS_SOCIAL_BASE_URL: ${{ vars.TATAS_SOCIAL_BASE_URL }}

      - name: Commit state updates (posted status + IG media IDs)
        if: always()
        run: |
          git config user.name  "tatas-agent"
          git config user.email "tatas@trevoadvisors.com"
          git add tatas/state.json
          git diff --cached --quiet || git commit -m "tatas: posts published $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main

      - name: Alert on failure (opens an issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tatas post-due FAILED — ${new Date().toISOString().slice(0, 10)}`,
              body: `A scheduled Instagram post failed (or the token is unhealthy). Failed posts stay approved and retry on the next run (max 3 attempts).\n\nCheck: \`cd tatas && node scripts/approve-week.js --list\`\n\nRun log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
