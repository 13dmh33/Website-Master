name: Milly weekly analytics

on:
  schedule:
    - cron: '0 4 * * 1'  # Sunday 10pm MDT (UTC-6) = Monday 4am UTC
  workflow_dispatch:      # manual trigger for testing

jobs:
  run-analytics:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to commit brand-voice.json updates

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: claude/milly-content-engine-qZme3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd milly && npm install

      - name: Run analyst
        run: cd milly && node agents/analyst.js
        env:
          ANTHROPIC_API_KEY:              ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN:         ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID:  ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

      - name: Commit updated brand voice
        run: |
          git config user.name  "milly-agent"
          git config user.email "milly@reeve.agency"
          git add milly/templates/brand-voice.json milly/output/archive/ || true
          git diff --cached --quiet || git commit -m "analyst: update brand voice for week of $(date +%Y-%m-%d)"
          git push origin claude/milly-content-engine-qZme3 || true

      - name: Upload analytics artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milly-analytics-${{ github.run_id }}
          path: milly/output/archive/
          retention-days: 90
