name: Miley approve week (Techs4Tatas)

# The one-tap APPROVAL step. After reviewing the week at
# https://trevoadvisors.com/review/miley/ (published by the Thursday pipeline),
# open this workflow in the GitHub app/site and tap "Run workflow".
# It flips the week's queue records pending → approved; the post-due cron then
# posts each at its slot time. Nothing posts without this step.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to approve (YYYY-MM-DD). Blank = latest week in queue.'
        required: false
        default: ''
      skip_slots:
        description: 'Slots to skip, space-separated (matches slot name substring, e.g. "sat-product").'
        required: false
        default: ''

concurrency:
  group: miley-git-writes
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # commit the approved queue records
      issues: write     # failure alert opens an issue

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Approve the week
        run: |
          cd miley
          ARGS=""
          [ -n "${{ github.event.inputs.week }}" ] && ARGS="--week ${{ github.event.inputs.week }}"
          for s in ${{ github.event.inputs.skip_slots }}; do ARGS="$ARGS --skip $s"; done
          node scripts/approve-week.js $ARGS
          echo "--- queue status ---"
          node scripts/approve-week.js --list

      - name: Commit approved queue
        run: |
          git config user.name  "miley-agent"
          git config user.email "miley@techs4tatas.com"
          git add miley/output/queue/
          git diff --cached --quiet || git commit -m "miley: week approved $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main

      - name: Alert on failure (opens an issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Miley approve-week FAILED — ${new Date().toISOString().slice(0, 10)}`,
              body: `The approval run failed — the week is NOT approved and nothing will post.\n\nRun log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
