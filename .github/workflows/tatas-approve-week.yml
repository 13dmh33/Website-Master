name: Tatas approve week (Tech 4 Tatas)

# The one-tap APPROVAL step. After reviewing the week at
# https://trevoadvisors.com/review/tatas/ (published by the Thursday pipeline),
# open this workflow in the GitHub app/site and tap "Run workflow".
# It flips the week's posts pending → approved; the tatas-post-due cron then
# posts each at its slot time. Nothing posts without this step.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to approve (Monday date, YYYY-MM-DD). Blank = latest week.'
        required: false
        default: ''
      skip_posts:
        description: 'Posts to skip, space-separated (matches post id substring, e.g. "self-check").'
        required: false
        default: ''

concurrency:
  group: tatas-git-writes
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # commit the approved state.json
      issues: write     # failure alert opens an issue

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Approve the week
        run: |
          cd tatas
          ARGS=""
          [ -n "${{ github.event.inputs.week }}" ] && ARGS="--week ${{ github.event.inputs.week }}"
          for s in ${{ github.event.inputs.skip_posts }}; do ARGS="$ARGS --skip $s"; done
          node scripts/approve-week.js $ARGS
          echo "--- post statuses ---"
          node scripts/approve-week.js --list

      - name: Commit approved state
        run: |
          git config user.name  "tatas-agent"
          git config user.email "tatas@trevoadvisors.com"
          git add tatas/state.json
          git diff --cached --quiet || git commit -m "tatas: week approved $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main

      - name: Alert on failure (opens an issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tatas approve-week FAILED — ${new Date().toISOString().slice(0, 10)}`,
              body: `The approval run failed — the week is NOT approved and nothing will post.\n\nRun log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
