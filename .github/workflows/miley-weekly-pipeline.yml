name: Miley weekly pipeline (Techs4Tatas)

on:
  schedule:
    - cron: '0 13 * * 4'   # Thursday ~7am MT — generates NEXT week for Thu-Sun review
  workflow_dispatch:        # manual trigger for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # commit the rotation counter + content output

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd miley && npm install

      - name: Run researcher
        run: cd miley && node agents/researcher.js

      - name: Run generator
        run: cd miley && node agents/generator.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run designer
        run: cd miley && node agents/designer.js

      - name: Run scheduler (review queue only)
        run: cd miley && node agents/scheduler.js
        env:
          FORCE_QUEUE: '1'   # never auto-post — Dave approves via push-queue.js

      - name: Commit rotation counter + content output
        run: |
          git config user.name  "miley-agent"
          git config user.email "miley@techs4tatas.com"
          git add miley/templates/post-formats.json miley/templates/evergreen.json miley/output/ || true
          git diff --cached --quiet || git commit -m "miley: week content + rotation $(date +%Y-%m-%d)"
          git push origin main || true

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miley-output-${{ github.run_id }}
          path: miley/output/
          retention-days: 14
