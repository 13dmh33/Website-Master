name: Miley post due (Techs4Tatas)

# Posts approved queue items whose slot time has arrived, directly to
# Instagram via the Graph API (no Buffer). Idempotent — runs that find
# nothing due exit in seconds.
#
# Cron hours fire 10 minutes after the base-week slot times. The scheduler
# stores scheduledFor in UTC using a fixed MT(-6) offset, so these line up
# exactly; anything missed goes out on the next run (72h staleness cutoff):
#   TUE 12:00 MT → Tue 18:10 UTC
#   THU 19:00 MT → Fri 01:10 UTC
#   SAT 10:00 MT → Sat 16:10 UTC
#   SUN 18:00 MT → Mon 00:10 UTC
# NOTE: October runs a daily campaign — add hours here (or run hourly) that month.

on:
  schedule:
    - cron: '10 18 * * 2'
    - cron: '10 1 * * 5'
    - cron: '10 16 * * 6'
    - cron: '10 0 * * 1'
  workflow_dispatch:        # manual catch-up / testing

concurrency:
  group: miley-git-writes
  cancel-in-progress: false

jobs:
  post-due:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # commit posted status + IG media IDs back to the queue
      issues: write     # failure alert opens an issue

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post due items to Instagram
        run: cd miley && node scripts/post-due.js
        env:
          INSTAGRAM_ACCESS_TOKEN:        ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          SOCIAL_BASE_URL:               ${{ vars.SOCIAL_BASE_URL }}

      - name: Commit queue updates (posted status + IG media IDs)
        if: always()
        run: |
          git config user.name  "miley-agent"
          git config user.email "miley@techs4tatas.com"
          git add miley/output/queue/
          git diff --cached --quiet || git commit -m "miley: posts published $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main

      - name: Alert on failure (opens an issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Miley post-due FAILED — ${new Date().toISOString().slice(0, 10)}`,
              body: `A scheduled Instagram post failed (or the token is unhealthy). Failed items stay in the queue and retry on the next run (max 3 attempts).\n\nCheck: \`cd miley && node scripts/approve-week.js --list\`\n\nRun log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
