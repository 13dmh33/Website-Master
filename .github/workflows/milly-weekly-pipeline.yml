name: Milly weekly pipeline

on:
  schedule:
    - cron: '0 13 * * 1'  # Monday 6am MDT (UTC-6) = 1pm UTC
  workflow_dispatch:       # manual trigger for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed for the analyst step to commit brand-voice updates

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: claude/milly-content-engine-qZme3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd milly && npm install

      - name: Run researcher
        run: cd milly && node agents/researcher.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_KEY:       ${{ secrets.SERPAPI_KEY }}

      - name: Run generator
        run: cd milly && node agents/generator.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run designer
        run: cd milly && node agents/designer.js
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Run scheduler
        run: cd milly && node agents/scheduler.js
        env:
          BUFFER_ACCESS_TOKEN:           ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_INSTAGRAM_PROFILE_ID:   ${{ secrets.BUFFER_INSTAGRAM_PROFILE_ID }}

      - name: Commit rotation counter update
        run: |
          git config user.name  "milly-agent"
          git config user.email "milly@reeve.agency"
          git add milly/templates/post-formats.json milly/output/ || true
          git diff --cached --quiet || git commit -m "milly: week rotation + content output $(date +%Y-%m-%d)"
          git push origin claude/milly-content-engine-qZme3 || true

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milly-output-${{ github.run_id }}
          path: milly/output/
          retention-days: 14
