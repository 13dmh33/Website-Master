[build]
  publish = "website"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- website netlify.toml netlify"

[[redirects]]
  from = "/"
  to = "/start/"
  status = 301

[[redirects]]
  from = "/demo/"
  to = "/demos/plumbing/"
  status = 301

[[redirects]]
  from = "/demo/index.html"
  to = "/demos/plumbing/"
  status = 301

[[redirects]]
  from = "/demo/electrician.html"
  to = "/demos/electrical/"
  status = 301

[[redirects]]
  from = "/demo/hvac.html"
  to = "/demos/hvac/"
  status = 301
